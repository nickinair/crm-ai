<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>涌客CRM销售系统</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: #0B0F19;
        }
        .lightning-loading-wrapper {
          display: inline-flex;
          justify-content: center;
          align-items: center;
          width: 1em;
          height: 1em;
          font-size: 56px;
          position: relative;
        }
        .lightning-loading-wrapper::before {
          content: '';
          position: absolute;
          width: 40px;
          height: 40px;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(59, 130, 246, 0.15) 40%, transparent 70%);
          border-radius: 50%;
          animation: lightning-aura 2.2s ease-in-out infinite;
          z-index: -1;
        }
        .lightning-icon {
          width: 100%;
          height: 100%;
          animation: lightning-pulse 2.2s ease-in-out infinite;
        }
        .bolt-trail-1 { stroke-dasharray: 3 57; animation: bolt-run 1.6s linear infinite; }
        .bolt-trail-2 { stroke-dasharray: 6 54; animation: bolt-run 1.6s linear infinite; animation-delay: 0.05s; }
        .bolt-trail-3 { stroke-dasharray: 10 50; animation: bolt-run 1.6s linear infinite; animation-delay: 0.1s; }
        .bolt-trail-4 { stroke-dasharray: 16 44; animation: bolt-run 1.6s linear infinite; animation-delay: 0.15s; }
        @keyframes bolt-run { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
        @keyframes lightning-aura {
          0% { transform: scale(0.9); opacity: 0.4; }
          50% { transform: scale(2.2); opacity: 0.9; }
          100% { transform: scale(0.9); opacity: 0.4; }
        }
        @keyframes lightning-pulse {
          0% { transform: scale(0.92); opacity: 0.75; filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.5)) drop-shadow(0 0 10px rgba(59, 130, 246, 0.3)); }
          50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.9)) drop-shadow(0 0 28px rgba(59, 130, 246, 0.7)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.3)); }
          100% { transform: scale(0.92); opacity: 0.75; filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.5)) drop-shadow(0 0 10px rgba(59, 130, 246, 0.3)); }
        }
      </style>
      <div class="initial-loader">
        <div class="lightning-loading-wrapper">
          <svg class="lightning-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="boltFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#A855F7" />
                <stop offset="100%" stop-color="#3B82F6" />
              </linearGradient>
              <filter id="edgeGlow">
                <feGaussianBlur stdDeviation="0.5" result="blur" />
                <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
              <filter id="edgeGlowStrong">
                <feGaussianBlur stdDeviation="0.8" result="blur" />
                <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
            <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#boltFillGrad)" opacity="0.9" />
            <path class="bolt-trail bolt-trail-4" d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="none" stroke="rgba(168, 130, 255, 0.15)" stroke-width="0.5" stroke-linejoin="round" />
            <path class="bolt-trail bolt-trail-3" d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="none" stroke="rgba(190, 170, 255, 0.3)" stroke-width="0.5" stroke-linejoin="round" />
            <path class="bolt-trail bolt-trail-2" d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="none" stroke="rgba(220, 210, 255, 0.55)" stroke-width="0.6" stroke-linejoin="round" filter="url(#edgeGlow)" />
            <path class="bolt-trail bolt-trail-1" d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="none" stroke="rgba(255, 255, 255, 0.95)" stroke-width="0.7" stroke-linejoin="round" filter="url(#edgeGlowStrong)" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
